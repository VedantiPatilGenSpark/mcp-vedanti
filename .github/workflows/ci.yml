name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install .
      - name: Installed host files
        run: |
          python -c "from mcp_vedanti.host.adapter import load_config; from mcp_vedanti.host.__main__ import QUERIES_PATH; load_config(); assert QUERIES_PATH.is_file(), QUERIES_PATH"
      - name: Test
        run: pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t mcp-vedanti:ci .
      - name: Installed host files
        run: |
          docker run --rm --entrypoint python mcp-vedanti:ci -c "from mcp_vedanti.host.adapter import load_config; from mcp_vedanti.host.__main__ import QUERIES_PATH; load_config(); assert QUERIES_PATH.is_file(), QUERIES_PATH"
