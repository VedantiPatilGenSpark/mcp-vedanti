[project]
name = "mcp-vedanti"
version = "0.1.0"
description = "IT equipment-request MCP server and agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcp-vedanti = "mcp_vedanti.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
